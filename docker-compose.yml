services:
  postgres:
    image: postgres:16-alpine
    container_name: multitech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: multitech_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multitech_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multitech-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/multitech_db?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      ALLOW_OFFLINE_ADMIN_FALLBACK: "false"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://admin.localhost:3000}
      NEXT_PUBLIC_WORKSHOP_WA: ${NEXT_PUBLIC_WORKSHOP_WA:-6281234567890}
      MEDIA_STORAGE_PATH: /app/media
    ports:
      - "3000:3000"
    volumes:
      - ./media:/app/media
